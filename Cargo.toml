[package]
name = "big-text-viewer"
version = "4.0.0"
edition = "2021"
build = "build.rs"
authors = ["ChunChun"]
description = "Big Text Viewer V4 - high-performance viewer for text files up to 4GB"
license = "MIT"

[dependencies]
egui = "0.29.1"
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
memmap2 = "0.9.5"
encoding_rs = "0.8.35"
chardetng = "0.1.17"
memchr = "2.7.4"
rfd = "0.15.1"

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
